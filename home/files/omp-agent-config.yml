providers:
  webSearchGeminiModel: gemini-3.5-flash-lite
retry:
  fallbackChains:
    devin/swe-2:
      - anthropic/claude-opus-5-5:medium
setupVersion: 2
statusLine:
  preset: nerd
  compactThinkingLevel: false
terminal:
  showProgress: true
tui:
  tight: true
  scrollbackRebuild: true
  codexResetFireworks: true
  imeSafeCursor: true
display:
  showTokenUsage: true
  cacheMissMarker: true
memory:
  backend: hindsight
autolearn:
  autoContinue: true
bashInterceptor:
  enabled: true
eval:
  autoBackground:
    enabled: true
astGrep:
  enabled: true
checkpoint:
  enabled: true
github:
  enabled: true
task:
  eager: preferred
  isolation:
    mode: auto
    commits: ai
  showResolvedModelBadge: true
  agentAdvisor:
    task: "off"
  agentModelOverrides:
    reviewer: openai-codex/gpt-6-astra:high
    sonic: openai-codex/gpt-6-luna:low
    security-reviewer: openai-codex/gpt-6-astra:high
modelRoles:
  default: openai-codex/gpt-6-astra:medium
  plan: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-opus-5-5:xhigh
  task: devin/swe-2:high
  advisor: anthropic/claude-sonnet-5:medium
  browser: google/gemini-3.8-flash:medium
  smol: google/gemini-3.8-flash:medium
  vision: google/gemini-3.8-flash:high
  tiny: google/gemini-3.5-flash-lite:minimal
  commit: openai-codex/gpt-6-luna:low
  TRIVIAL: google/gemini-3.8-flash:high
defaultThinkingLevel: auto
find:
  enabled: true
hindsight:
  apiUrl: https://hindsight-api.bhyoo.com
  scoping: per-project
compaction:
  idleEnabled: true
  idleThresholdTokens: 300000
worktree:
  base: ""
stt:
  modelName: parakeet
tier:
  advisor: inherit
  google: priority
cycleOrder:
  - default
  - TRIVIAL
browser:
  enabled: false
snapcompact:
  toolResults: true
web_search:
  enabled: false
tts:
  localModel: kokoro
symbolPreset: nerd
dev:
  autoqaConsent: granted
features:
  unexpectedStopDetection: true
