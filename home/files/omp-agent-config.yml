retry:
  usageAwareFallback: true
  usageReservePolicy: auto
  fallbackChains:
    anthropic/claude-opus-5-5:
      - google-antigravity/claude-opus-5-5
    vision:
      - google-antigravity/gemini-4-argon:medium
setupVersion: 2
extendedContext: true
statusLine:
  preset: nerd
  compactThinkingLevel: false
terminal:
  showProgress: true
tui:
  tight: true
  codexResetFireworks: true
  imeSafeCursor: true
display:
  showTokenUsage: true
  cacheMissMarker: true
memory:
  backend: hindsight
autolearn:
  autoContinue: true
bashInterceptor:
  enabled: true
eval:
  autoBackground:
    enabled: true
astGrep:
  enabled: true
checkpoint:
  enabled: true
github:
  enabled: true
task:
  eager: preferred
  isolation:
    commits: ai
  showResolvedModelBadge: true
  agentAdvisor:
    task: "off"
  agentModelOverrides:
    reviewer: openai-codex/gpt-6.1-terra:medium, xai-oauth/grok-4.7-build-fast:low
    scout: xai-oauth/grok-4.7-build-fast:low, anthropic/claude-sonnet-5-5:medium
    sonic: anthropic/claude-haiku-5-5:low
    security-reviewer: openai-codex/gpt-6.1-sol:max
modelRoles:
  default: anthropic/claude-opus-5-5:medium
  plan: google-antigravity/gemini-4-argon:high
  slow: anthropic/claude-opus-5-5:xhigh
  task: anthropic/claude-opus-5-5:medium
  advisor: anthropic/claude-sonnet-5-5:medium
  browser: anthropic/claude-haiku-5-5:medium
  smol: anthropic/claude-haiku-5-5:medium
  vision: openai-codex/gpt-6.1-terra:low
  tiny: anthropic/claude-haiku-5-5:low
  commit: google-vertex/gemini-3.5-flash-lite:low
  judge: typesafe/jev-preview
defaultThinkingLevel: auto
find:
  enabled: true
hindsight:
  apiUrl: https://hindsight-api.bhyoo.com
  scoping: per-project
compaction:
  idleEnabled: true
  idleThresholdTokens: 300000
worktree:
  base: ""
tier:
  advisor: inherit
  google: priority
  openai: priority
cycleOrder:
  - default
browser:
  enabled: false
snapcompact:
  toolResults: true
web_search:
  enabled: false
symbolPreset: nerd
dev:
  autoqaConsent: granted
features:
  unexpectedStopDetection: true
