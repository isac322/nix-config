retry:
  usageAwareFallback: true
  usageReservePolicy: auto
  fallbackChains:
    anthropic/claude-opus-5-5:
      - google-antigravity/claude-opus-5-5
    anthropic/claude-haiku-5-5:
      - google-vertex/gemini-3.8-flash:low
    vision:
      - google-antigravity/gemini-4-argon:medium
setupVersion: 3
extendedContext: true
statusLine:
  preset: custom
  leftSegments:
    - vim
    - model
    - mode
    - path
    - git
    - pr
    - session
    - subagents
  rightSegments:
    - session_name
    - cache
    - cache_hit
    - cost
    - context_pct
    - context_total
    - time_spent
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 32
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
    time:
      format: "24h"
      showSeconds: true
terminal:
  showProgress: true
tui:
  tight: true
  imeSafeCursor: true
display:
  showTokenUsage: true
  cacheMissMarker: true
btw:
  inject: true
memory:
  backend: hindsight
autolearn:
  autoContinue: true
eval:
  autoBackground:
    enabled: true
astGrep:
  enabled: true
checkpoint:
  enabled: true
github:
  enabled: true
task:
  isolation:
    commits: ai
  showResolvedModelBadge: true
  completionProbe: false
  agentAdvisor:
    task: "off"
  agentModelOverrides:
    reviewer: openai-codex/gpt-6.1-terra:medium, xai-oauth/grok-4.7-build-fast:low
    scout: xai-oauth/grok-4.7-build-fast:low, anthropic/claude-sonnet-5-5:high
    sonic: anthropic/claude-haiku-5-5:low, google-vertex/gemini-3.8-flash:low, openai-codex/gpt-6.1-terra:low
    security-reviewer: openai-codex/gpt-6.1-sol:max
modelRoles:
  default: anthropic/claude-opus-5-5:medium
  plan: google-antigravity/gemini-4-argon:high
  slow: anthropic/claude-opus-5-5:xhigh
  task: anthropic/claude-opus-5-5:medium
  advisor: anthropic/claude-sonnet-5-5:high
  browser: anthropic/claude-haiku-5-5:medium, google-vertex/gemini-3.8-flash:low, openai-codex/gpt-6.1-terra:low
  smol: anthropic/claude-haiku-5-5:medium, google-vertex/gemini-3.8-flash:low, google-vertex/gemini-3.5-flash-lite:medium
  vision: openai-codex/gpt-6.1-terra:low
  tiny: anthropic/claude-haiku-5-5:low, google-vertex/gemini-3.8-flash:low, openai-codex/gpt-6.1-terra:low
  commit: google-vertex/gemini-3.5-flash-lite:low
  judge: typesafe/jev-preview
find:
  enabled: true
hindsight:
  apiUrl: https://hindsight-api.bhyoo.com
  scoping: per-project-tagged
  globalScope: true
compaction:
  idleEnabled: true
  idleThresholdTokens: 300000
tier:
  advisor: inherit
  google: priority
  openai: priority
cycleOrder:
  - default
browser:
  enabled: false
snapcompact:
  toolResults: true
symbolPreset: nerd
dev:
  autoqaConsent: granted
features:
  unexpectedStopDetection: true
providers:
  cacheWarming: streaming
