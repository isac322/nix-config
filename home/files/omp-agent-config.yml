retry:
  fallbackChains:
    default:
      - google-antigravity/claude-opus-5-5:medium
      - openai-codex/gpt-6.1-sol:high
    task:
      - google-antigravity/claude-opus-5-5:high
      - openai-codex/gpt-6.1-sol:high
      - google-antigravity/gemini-4-carbon:high
    plan:
      - anthropic/claude-fable-5-2:high
      - openai-codex/gpt-6.1-sol:high
    slow:
      - anthropic/claude-opus-5-5:xhigh
      - openai-codex/gpt-6.1-sol:max
    advisor:
      - openai-codex/gpt-6.1-sol:high
      - google-antigravity/gemini-4-carbon:high
    browser:
      - google-antigravity/gemini-4-hydrogen-high:high
      - openai-codex/gpt-6.1-terra:medium
    smol:
      - anthropic/claude-sonnet-5-5:low
      - openai-codex/gpt-6.1-terra:low
    vision:
      - anthropic/claude-sonnet-5-5:medium
      - openai-codex/gpt-6.1-terra:medium
    tiny:
      - openai-codex/gpt-6.1-terra:low
    commit:
      - openai-codex/gpt-6.1-terra:low
setupVersion: 3
extendedContext: true
statusLine:
  preset: custom
  showHookStatus: false
  leftSegments:
    - vim
    - model
    - mode
    - status
    - path
    - git
    - pr
    - session
    - subagents
  rightSegments:
    - session_name
    - cache
    - cache_hit
    - cost
    - context_pct
    - context_total
    - time_spent
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 32
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
    time:
      format: "24h"
      showSeconds: true
terminal:
  showProgress: true
tui:
  tight: true
  imeSafeCursor: true
display:
  showTokenUsage: true
  cacheMissMarker: true
btw:
  inject: true
memory:
  backend: hindsight
autolearn:
  autoContinue: true
eval:
  autoBackground:
    enabled: true
astGrep:
  enabled: true
checkpoint:
  enabled: true
github:
  enabled: true
task:
  isolation:
    commits: ai
  showResolvedModelBadge: true
  completionProbe: false
  agentAdvisor:
    task: "off"
  agentModelOverrides:
    reviewer: openai-codex/gpt-6.1-sol:high, google-antigravity/gemini-4-carbon:high
    scout: xai-oauth/grok-4.7-build-fast:medium, google-antigravity/gemini-4-hydrogen-high:high, anthropic/claude-sonnet-5-5:medium
    sonic: anthropic/claude-haiku-5-5:low, openai-codex/gpt-6.1-terra:low
    security-reviewer: openai-codex/gpt-6.1-sol:max, google-antigravity/gemini-4-carbon:high, anthropic/claude-opus-5-5:xhigh
modelRoles:
  default: anthropic/claude-opus-5-5:medium
  plan: google-antigravity/gemini-4-carbon:high
  slow: anthropic/claude-fable-5-2:high
  task: anthropic/claude-opus-5-5
  advisor: anthropic/claude-sonnet-5-5:high
  browser: anthropic/claude-sonnet-5-5:medium
  smol: anthropic/claude-haiku-5-5:medium
  vision: google-antigravity/gemini-4-hydrogen-high:high
  tiny: anthropic/claude-haiku-5-5:low
  commit: anthropic/claude-haiku-5-5:low
  judge: typesafe/jev-1.14.0
find:
  enabled: true
hindsight:
  apiUrl: https://hindsight-api.bhyoo.com
  scoping: per-project-tagged
  globalScope: true
compaction:
  idleEnabled: true
  idleThresholdTokens: 300000
tier:
  advisor: inherit
  google: priority
  openai: priority
cycleOrder:
  - default
browser:
  enabled: false
snapcompact:
  toolResults: true
symbolPreset: nerd
dev:
  autoqaConsent: granted
features:
  unexpectedStopDetection: true
providers:
  cacheWarming: streaming
